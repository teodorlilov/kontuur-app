name: check

# Runs on every push and PR, not just main. The pre-push hook covers the same
# ground locally, but it is skippable (`--no-verify`) and only exists on machines
# where `npm install` has run — so this is the copy that is actually authoritative.
on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 24 LTS: Next 16 requires >=20, and this is what Vercel builds with.
          # Bump both together if the deploy runtime moves.
          node-version: 24
          cache: npm

      # ci, not install: builds from the lockfile exactly, so a run cannot pass on
      # a dependency tree that no one has committed.
      #
      # If this ever fails with "Missing: @emnapi/core@<x> from lock file", the lock
      # was written by an npm too old to record it. `@oxc-resolver/binding-wasm32-wasi`
      # pins @emnapi/core and @emnapi/runtime to exact versions the root does not hoist,
      # so they need their own nested entries; npm 11.6 and earlier judge the pin already
      # satisfied and omit them, while npm 10 and npm 11.17+ both demand them and refuse
      # to install. Fix it by upgrading the npm that writes the lock, never by loosening
      # this step — the local npm is the one out of date, not CI.
      - run: npm ci

      # typecheck && lint && test. Deliberately NOT `npm test` — vitest is
      # transpile-only, so tests alone prove nothing about types.
      - run: npm run check

      # `tsc --noEmit` does not evaluate the App Router's own rules: a server-only
      # module pulled into a client bundle, a bad `metadata` shape, an invalid route
      # segment config. On an app that routes 50+ files through a service-role Supabase
      # client, "server code reached the browser" is precisely the class of mistake worth
      # a build to catch — and `npm run check` passing was never evidence the app builds.
      # Env vars are placeholders: the build only needs them present, not valid.
      # ANTHROPIC_API_KEY is here because `src/utils/ai-client.ts` throws at module scope
      # when it is missing, and collecting page data imports the AI routes — so its absence
      # fails the build outright rather than any request. A key that is present and invalid
      # is enough; nothing here calls the API.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.test
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          ANTHROPIC_API_KEY: placeholder-anthropic-key
