        </div>
        <p class="alt">No website? <button id="manual">Set them up by hand</button></p>
      </section>

      <section id="s2" class="hide">
        <div class="sheet">
          <div class="sh-h">
            <span class="mono empty" id="mono" aria-hidden="true"></span>
            <div class="sh-t">
              <h1 id="dName">Reading the site…</h1>
              <p id="dSub"></p>
            </div>
            <div class="sh-a" id="dAct"></div>
          </div>
          <div
            class="scan"
            id="scan"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-label="Reading the site"
          >
            <i id="scanI"></i>
          </div>
          <div id="doc"></div>
        </div>
      </section>

      <section id="s3" class="hide"></section>
    </div>

    <div class="bar" id="bar">
      <div class="bar-in">
        <p class="bar-t" id="barT"><span class="dot"></span><span id="barTx"></span></p>
        <button class="jump hide" id="jump">Take me there ↓</button>
        <button class="btn btn-danger" id="discard">Discard</button>
        <button class="btn btn-primary btn-lg" id="save">Save client →</button>
      </div>
    </div>

    <div class="lb" id="lb" hidden>
      <button class="lb-x" id="lbx">Close ✕</button>
      <!-- Filled by openLightbox. Deliberately empty: an image element parked here
       as a placeholder needs an empty source attribute, which resolves against
       the document, so the browser re-requests this page as an image before
       anything is ever zoomed. (Spelling that tag out in this comment tripped
       the design scanner, which reads prose as source — the same trap
       globals.css documents for Tailwind's class scanner.) -->
      <figure id="lbfig"></figure>
    </div>

    <div class="sr" role="status" aria-live="polite" id="live"></div>

    <script>
      'use strict'

      /* ════ The draft.
   Confidence and status are not invented: detected_niche_confidence is
   'high' | 'medium' | 'low' in src/types/api.ts, and brand_kit_extractions
   (migration 20260718) carries status 'pending' | 'ready' | 'fallback' | 'failed'
   plus a confidence report and source_kind 'default' | 'website' | 'manual'. ════ */
      var GROUPS = [
        { id: 'basics', name: 'The basics', col: 0 },
        { id: 'people', name: 'Their people', col: 0 },
        { id: 'voice', name: 'How they sound', col: 0 },
        { id: 'look', name: 'Content and look', col: 1 },
        { id: 'pub', name: 'Publishing', col: 1 },
        { id: 'system', name: 'Their visual system', full: 1 },
      ]

      /* BRAND_STYLES, from src/lib/visual/brand-styles.ts — the scalable design
   systems a client's AI visuals are generated in. Two today; adding a third is
   one entry there plus one preview jpg, which is why this is a registry and not
   a free-text field. The previews are the real files under public/. */
      var STYLES = [
        {
          id: 'graphic-editorial',
          name: 'Graphic Editorial',
          desc: 'Bold modernist magazine energy — expressive grids, collage, tactile print textures.',
          fonts: 'Oswald · Source Sans 3',
          src: '../../public/brand-styles/graphic-editorial.jpg',
        },
        {
          id: 'clinical-luxury',
          name: 'Clinical Luxury',
          desc: 'Premium beauty-editorial calm — close-up photography, negative space, refined restraint.',
          fonts: 'Playfair Display · Commissioner',
          src: '../../public/brand-styles/clinical-luxury.jpg',
        },
      ]
      function styleById(id) {
        for (var i = 0; i < STYLES.length; i++) if (STYLES[i].id === id) return STYLES[i]
        return STYLES[0]
      }

      /* WEEKDAY_OPTIONS and POSTS_PER_RUN_OPTIONS, from src/utils/constants.ts. */
      var WEEKDAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday']
      var PER_RUN = ['1', '2', '3', '4', '5', '6', '7']

      /* PLATFORMS from src/utils/constants.ts, and the LIVE_PLATFORMS set that
   schedule-tab.tsx uses to grey out the ones that cannot publish yet. The rows
   are PLATFORM_ROWS from settings/connected-accounts-tab.tsx. */
      var PLATFORMS = ['Instagram', 'Facebook', 'LinkedIn', 'X / Twitter', 'TikTok']
      var LIVE_PLATFORMS = { Instagram: 1, Facebook: 1 }
      var ACCOUNTS = [
        {
          id: 'instagram',
          label: 'Instagram',
          initials: 'IG',
          note: 'Business or Creator account required',
          supported: 1,
        },
        {
          id: 'facebook',
          label: 'Facebook Page',
          initials: 'FB',
          note: 'Needed for Instagram publishing',
          supported: 1,
        },
        { id: 'linkedin', label: 'LinkedIn', initials: 'LI', note: 'Company pages', supported: 0 },
      ]
      /* Connection state is not a profile field you type — it belongs to the account,
   not the client's brief — so it lives beside A rather than inside it. */
      var connected = { instagram: false, facebook: false }

      var ROWS = [
        {
          id: 'name',
          g: 'basics',
          l: 'Client name',
          ph: 'Acme Studio',
          v: 'Недвижими имоти Витоша',
          src: 'the page title',
          conf: 'high',
        },
        {
          id: 'niche',
          g: 'basics',
          l: 'What they do',
          ph: 'What do they sell or do?',
          v: 'Real estate agency',
          src: 'their services page',
          conf: 'high',
        },

        {
          id: 'aud',
          g: 'people',
          l: 'Audience',
          conf: 'high',
          src: 'services and about pages',
          kind: 'tags',
          v: [
            'Property buyers',
            'Property sellers',
            'Investors',
            'Valuation clients',
            'Legal consultation',
          ],
        },
        {
          id: 'goal',
          g: 'people',
          l: 'Post goal',
          ask: 1,
          q: 'The site never says what a post should get someone to do.',
          opts: ['Book a viewing', 'Send an enquiry', 'Follow and engage', 'Build trust'],
        },

        {
          id: 'tone',
          g: 'voice',
          l: 'Tone',
          big: 1,
          conf: 'high',
          src: 'their own copy',
          ph: 'How should their posts sound?',
          v: 'Professional and attentive. Clear and informative, never pushy. Speaks to people making a large, careful decision.',
        },
        {
          id: 'lang',
          g: 'voice',
          l: 'Language',
          ph: 'English',
          v: 'Bulgarian — formal (Вие)',
          src: 'the site language',
          conf: 'high',
        },
        {
          id: 'avoid',
          g: 'voice',
          l: 'Never post',
          big: 1,
          conf: 'low',
          src: 'real-estate defaults',
          ph: 'Anything they must never post about',
          v: 'Political content, unverified property claims, financial advice beyond real estate, discriminatory housing language.',
        },

        /* The mix bars are the metric ramp — four greens for four series, deliberately
     not four unrelated hues. See DESIGN.md § The Botanical Closure Rule. */
        {
          id: 'mix',
          g: 'look',
          l: 'Content mix',
          conf: 'high',
          src: 'what they publish',
          kind: 'mix',
          v: [
            ['Property listings & market updates', 40, 'var(--metric-1)'],
            ['Expert team & services', 25, 'var(--metric-2)'],
            ['Real estate advice & tips', 20, 'var(--metric-3)'],
            ['Client testimonials', 15, 'var(--metric-4)'],
          ],
        },
        {
          id: 'pal',
          g: 'look',
          l: 'Brand palette',
          ask: 1,
          kind: 'sw',
          v: ['#ffffff', '#707070', '#a886cd', '#6d5785', '#e0e0e0'],
          q: 'Purple is unusual for an estate agency — a cookie banner over the page can cause this.',
          opts: ['Looks right', 'Pick manually', 'Re-scan'],
        },
        {
          id: 'style',
          g: 'system',
          l: 'Visual system',
          kind: 'style',
          v: 'graphic-editorial',
          src: 'bold grids, strong type',
          conf: 'low',
        },

        {
          id: 'sched',
          g: 'pub',
          l: 'Schedule',
          kind: 'sched',
          src: 'a starting cadence',
          conf: 'pend',
          v: { day: 'Monday', time: '09:00', n: '3' },
        },
        {
          id: 'plat',
          g: 'pub',
          l: 'Platform',
          kind: 'plat',
          v: 'Instagram',
          src: 'not connected yet',
          conf: 'pend',
        },
      ]

      var A = {},
        resolved = {},
        host = 'everestimoti.com',
        manualMode = false,
        reviewing = false
      var doc = document.getElementById('doc')
      var live = document.getElementById('live')
      var page = document.getElementById('page')

      /* One row carries the present-tense marker, handed over rather than cleared on a
   timer — overlapping timers would put several on screen at once. */
      var liveEl = null
      function setLive(el) {
        if (liveEl) liveEl.classList.remove('live')
        liveEl = el
        if (el) el.classList.add('live')
      }

      function hasCyrillic(s) {
        return /[Ѐ-ӿ]/.test(String(s || ''))
      }
      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
      }
      function initials(s) {
        return String(s)
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map(function (w) {
            return w[0]
          })
          .join('')
          .toUpperCase()
      }

      /* CLIENT_COLORS, verbatim from src/utils/constants.ts. Its own note records that
   a pure green ramp was tried here and failed — at pill opacity forest and
   forest-deep read as one swatch — so these step through hue and lightness, kept
   desaturated so none competes with the green chrome. The client's OWN detected
   brand hex never lands here; it appears only in the Brand palette row, where it
   is the data under review. */
      var CLIENT_COLORS = [
        '#164430',
        '#2E9E68',
        '#1F6B7A',
        '#8A6116',
        '#6E7F52',
        '#5FA8B5',
        '#A2603F',
        '#7FA588',
      ]
      function hashIndex(name, buckets) {
        var hash = 0
        for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0
        return hash % buckets
      }
      function clientHue(name) {
        return CLIENT_COLORS[hashIndex(String(name), CLIENT_COLORS.length)]
      }
      function rowById(id) {
        for (var i = 0; i < ROWS.length; i++) if (ROWS[i].id === id) return ROWS[i]
        return null
      }

      function initA() {
        ROWS.forEach(function (r) {
          if (r.ask && !r.kind) return
          if (Array.isArray(r.v))
            A[r.id] = r.v.map(function (x) {
              return Array.isArray(x) ? x.slice() : x
            })
          /* Copied, not aliased: the schedule is the one row whose value is an object,
       and sharing it with ROWS would make editing the draft rewrite the seed. */ else if (
            r.v &&
            typeof r.v === 'object'
          )
            A[r.id] = { day: r.v.day, time: r.v.time, n: r.v.n }
          else A[r.id] = r.v || ''
        })
      }
      initA()

      /* ════ Contour field ════
   Alpha and stroke weight track components/layout/contour-field.tsx: .05–.14
   forest, 0.7px with every fifth line at 1.1px. */
      function ringPath(cx, cy, r, rough, seed) {
        var pts = [],
          steps = 46
        for (var s = 0; s < steps; s++) {
          var a = (s / steps) * Math.PI * 2
          var wob =
            Math.sin(a * 3 + seed) * 0.16 +
            Math.sin(a * 5 - seed * 1.7) * 0.09 +
            Math.sin(a * 2 + seed * 0.6) * 0.13
          var rr = r * (1 + wob * rough)
          pts.push(
            Math.round(cx + Math.cos(a) * rr * 1.18) + ' ' + Math.round(cy + Math.sin(a) * rr)
          )
        }
        return 'M' + pts.join('L') + 'Z'
      }
      var fieldPaths = (function () {
        var el = document.getElementById('field'),
          all = []
        el.setAttribute('viewBox', '0 0 1300 900')
        ;[
          { x: 100, y: 180, r0: 34, step: 27, rings: 9 },
          { x: 1200, y: 700, r0: 40, step: 32, rings: 9 },
          { x: 1240, y: 110, r0: 26, step: 22, rings: 7 },
        ].forEach(function (p, pi) {
          for (var r = 0; r < p.rings; r++)
            all.push({
              d: ringPath(p.x, p.y, p.r0 + r * p.step, 0.1 + r * 0.055, pi * 2.4 + r * 0.31),
              o: Math.max(0.13, 0.3 - r * 0.021).toFixed(3),
              major: r % 5 === 0,
              order: r + pi * 0.34,
            })
        })
        all.sort(function (a, b) {
          return a.order - b.order
        })
        el.innerHTML = all
          .map(function (p, n) {
            return (
              '<path class="' +
              (p.major ? 'major' : '') +
              '" d="' +
              p.d +
              '" pathLength="1" ' +
              'style="--o:' +
              p.o +
              ';transition-delay:' +
              n * 22 +
              'ms"/>'
            )
          })
          .join('')
        return el.querySelectorAll('path')
      })()
      function surveyField(frac) {
        var shown = Math.round((0.3 + 0.7 * frac) * fieldPaths.length)
        for (var n = 0; n < fieldPaths.length; n++)
          fieldPaths[n].classList.toggle('surveyed', n < shown)
      }
      surveyField(0)

      /* ════ 1 · Ask ════ */
      var url = document.getElementById('url'),
        go = document.getElementById('go')
      url.addEventListener('input', function () {
        go.disabled = !url.value.trim()
      })
      url.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && url.value.trim()) start(false)
      })
      go.onclick = function () {
        start(false)
      }
      document.getElementById('manual').onclick = function () {
        start(true)
      }

      /* ════ 2 · The form draws first, then fills ════ */
      function start(isManual) {
        manualMode = isManual
        host = (url.value.trim() || 'everestimoti.com')
          .replace(/^https?:\/\//, '')
          .replace(/\/$/, '')
        document.getElementById('s1').classList.add('hide')
        document.getElementById('s2').classList.remove('hide')
        page.classList.add('wide')
        buildForm()
        if (isManual) return startManual()

        document.getElementById('dSub').innerHTML = 'Reading <b>' + esc(host) + '</b>…'
        live.textContent = 'Reading ' + host + '. Drafting the client profile.'

        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        var n = 0
        ;(function tick() {
          if (n >= ROWS.length) return finish()
          var r = ROWS[n]
          fillRow(r)
          setLive(doc.querySelector('.crow[data-id="' + r.id + '"]'))
          n++
          setScan(n / ROWS.length)
          surveyField(n / ROWS.length)
          if (r.id === 'name') nameLanded(r.v)
          setTimeout(tick, reduce ? 0 : n < 3 ? 380 : 200)
        })()
      }

      /* Every field, in its final position, waiting for a value. */
      function buildForm() {
        doc.innerHTML =
          '<div class="cols">' +
          [0, 1]
            .map(function (col) {
              return (
                '<div>' +
                GROUPS.filter(function (g) {
                  return g.col === col
                })
                  .map(function (g) {
                    return group(g)
                  })
                  .join('') +
                '</div>'
              )
            })
            .join('') +
          '</div>' +
          GROUPS.filter(function (g) {
            return g.full
          })
            .map(function (g) {
              return group(g, 'band')
            })
            .join('')
        setBar(0)
      }

      function group(g, cls) {
        var rows = ROWS.filter(function (r) {
          return r.g === g.id
        })
        return (
          '<section class="' +
          (cls || 'grp') +
          '"><h2>' +
          esc(g.name) +
          '</h2>' +
          rows.map(pendingRow).join('') +
          '</section>'
        )
      }

      /* A row whose value is a picker, a gallery or a list rather than a line of text.
   These break out of the label/value/edit grid and take the full column. */
      function isBlock(r) {
        return r.kind === 'mix' || r.kind === 'style'
      }

      function pendingRow(r) {
        /* Placeholder width tracks the eventual value, so the row settles rather than jumps. */
        var w = r.ask ? 55 : Math.max(35, Math.min(88, String(r.v || '').length * 2.4 + 30))
        return (
          '<div class="crow pending" data-id="' +
          esc(r.id) +
          '">' +
          '<span class="cl">' +
          esc(r.l) +
          '</span>' +
          '<div class="cv"><span class="skel" style="width:' +
          Math.round(w) +
          '%"></span></div>' +
          '<button class="cedit" data-edit="' +
          esc(r.id) +
          '">Edit</button></div>'
        )
      }

      function fillRow(r) {
        var row = doc.querySelector('.crow[data-id="' + r.id + '"]')
        if (!row) return
        row.classList.remove('pending')
        if (isBlock(r)) row.classList.add('block')
        /* Manual mode has nothing to read, so there is no read view to return to:
     the row opens once and stays open. */
        if (manualMode) {
          row.classList.add('open')
          row.querySelector('.cv').innerHTML = editorFor(r)
          return
        }
        if (r.ask && !resolved[r.id]) {
          row.classList.add('ask-me')
          row.querySelector('.cv').innerHTML = askBody(r)
        } else {
          row.querySelector('.cv').innerHTML = readValue(r)
          if (resolved[r.id]) row.classList.add('resolved')
        }
      }

      function askBody(r) {
        return (
          (r.kind === 'sw'
            ? '<div class="swr">' +
              (A[r.id] || [])
                .map(function (c) {
                  return '<i style="background:' + esc(c) + '"></i>'
                })
                .join('') +
              '</div>' +
              '<p class="sr">Detected palette: white, mid grey, light purple, deep purple, pale grey.</p>'
            : '') +
          '<p class="qq">' +
          esc(r.q) +
          '</p>' +
          '<div class="qz-o" role="radiogroup" aria-label="' +
          esc(r.l) +
          '">' +
          r.opts
            .map(function (o, i) {
              return (
                '<button role="radio" aria-checked="false" tabindex="' +
                (i ? '-1' : '0') +
                '" ' +
                'data-opt="' +
                esc(o) +
                '">' +
                esc(o) +
                '</button>'
              )
            })
            .join('') +
          '</div>'
        )
      }

      /* The name lands at Headline in the sans whatever alphabet it is written in, so
   nothing here gates on hasCyrillic — the serif appears on the done screen, where
   the string is the whole line and the rule applies. */
      function nameLanded(name) {
        document.getElementById('dName').textContent = name
        var m = document.getElementById('mono'),
          hue = clientHue(name)
        m.classList.remove('empty')
        m.textContent = initials(name)
        /* 30%, not avatar.tsx's 14%: this is a 44px hero mark sitting on the Wash band
     rather than a small disc on white, and at 14% it disappears into the tint.
     The darkened-ink foreground does not change. */
        m.style.background = 'color-mix(in srgb, ' + hue + ' 30%, #ffffff)'
        m.style.color = 'color-mix(in srgb, ' + hue + ' 78%, var(--ink))'
      }

      function setScan(frac) {
        document.getElementById('scanI').style.transform = 'scaleX(' + frac + ')'
        document.getElementById('scan').setAttribute('aria-valuenow', Math.round(frac * 100))
      }

      function finish() {
        document.getElementById('scan').classList.add('off')
        setLive(null)
        setScan(1)
        surveyField(1)
        document.getElementById('dAct').innerHTML =
          '<button class="btn btn-sec btn-sm" id="rescan">Read it again</button>'
        reviewing = true
        updateHeader()
        setBar(openAsks().length)
        setTimeout(function () {
          document.getElementById('bar').classList.add('on')
        }, 200)
        live.textContent =
          ROWS.length +
          ' details drafted from ' +
          host +
          '. ' +
          openAsks().length +
          ' need your call.'
      }

      /* No website: the same skeleton, every field open and yours to fill. Nothing is
   invented — only the *shape* of a profile is supplied. */
      function startManual() {
        document.getElementById('dName').textContent = 'New client'
        document.getElementById('dSub').innerHTML = 'Nothing to read — fill this in yourself.'
        document.getElementById('scan').classList.add('off')
        doc.classList.add('manual')
        surveyField(1)
        ROWS.forEach(function (r) {
          if (r.kind === 'tags') A[r.id] = []
          /* Four unnamed pillars at an even split. The editor maps over this array, so
       an empty one rendered a heading, a Done button and nothing between them —
       there was no way to add a pillar at all. Four blank rows are the shape of a
       content mix, not a claim about this client. */ else if (r.kind === 'mix')
            A[r.id] = [
              ['', 25, 'var(--metric-1)'],
              ['', 25, 'var(--metric-2)'],
              ['', 25, 'var(--metric-3)'],
              ['', 25, 'var(--metric-4)'],
            ]
          else if (r.kind === 'sw')
            A[r.id] = ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff']
          /* A cadence has to start somewhere and the row says so — "a starting
       cadence" is a default, not a claim about this client. The platform does
       not: nothing is pre-selected, because that would be picking for you. */ else if (
            r.kind === 'sched'
          )
            A[r.id] = { day: 'Monday', time: '09:00', n: '3' }
          else if (r.kind === 'plat') A[r.id] = ''
          /* DEFAULT_BRAND_STYLE_ID in brand-styles.ts: getBrandStyle() resolves an
       unset id to Graphic Editorial, so a blank picker would show a choice the
       client does not actually have. Selecting the default states the truth. */ else if (
            r.kind === 'style'
          )
            A[r.id] = 'graphic-editorial'
          else A[r.id] = ''
          /* No source and no confidence: both describe a reading that never happened.
       `ask` is cleared but `opts` is kept — the four goal choices are a better
       input than a free-text box whether or not a site was read. Marking these
       rows `resolved` was the old bug: it painted "your call" on two fields you
       had not touched. */
          r.conf = ''
          r.src = ''
          r.ask = 0
          fillRow(r)
        })
        reviewing = true
        setBar(0)
        document.getElementById('bar').classList.add('on')
        live.textContent = 'Blank profile ready. Every field is open — fill in what you know.'
      }

      /* Counts a field as filled only if it holds something a person typed or picked:
   a blank pillar name or an untouched white swatch is still empty. */
      function filledCount() {
        return ROWS.filter(function (r) {
          var v = A[r.id]
          if (v && typeof v === 'object' && !Array.isArray(v)) return !!(v.day && v.time && v.n)
          if (Array.isArray(v))
            return v.some(function (x) {
              return Array.isArray(x)
                ? String(x[0]).trim() !== ''
                : x && x.toLowerCase() !== '#ffffff'
            })
          return String(v || '').trim() !== ''
        }).length
      }

      /* The identity mark earns its colour as you type, the same hash the roster and
   the calendar pill use — so the client is already wearing their colour before
   the profile is saved. */
      function manualName(value) {
        var name = String(value || '').trim()
        var mark = document.getElementById('mono')
        if (!name) {
          document.getElementById('dName').textContent = 'New client'
          mark.classList.add('empty')
          mark.textContent = ''
          mark.style.background = ''
          mark.style.color = ''
          return
        }
        nameLanded(name)
      }

      function openAsks() {
        return ROWS.filter(function (r) {
          return r.ask && !resolved[r.id]
        })
      }

      /* Read view — one line per row. The source stays visible; the value truncates. */
      function readValue(r) {
        var v = A[r.id]
        if (r.kind === 'tags') {
          var list = v || []
          var shown = list
            .slice(0, 2)
            .map(function (t) {
              return esc(t)
            })
            .join(', ')
          return (
            '<span class="val">' +
            (shown || '—') +
            (list.length > 2 ? ' <span class="src">+' + (list.length - 2) + ' more</span>' : '') +
            '</span>' +
            srcChip(r)
          )
        }
        /* The pillars are the answer, so they are listed. A 64px bar and the words
     "4 pillars" showed the shape of the split while hiding all four of the
     things the row exists to name. */
        if (r.kind === 'mix') {
          var mix = v || []
          if (!mix.length) return '<span class="val">—</span>' + srcChip(r)
          return (
            '<div class="mixbar" aria-hidden="true">' +
            mix
              .map(function (p) {
                return '<i style="flex-basis:' + p[1] + '%;background:' + p[2] + '"></i>'
              })
              .join('') +
            '</div><div class="mixlist">' +
            mix
              .map(function (p) {
                return (
                  '<div class="mixrow"><i style="background:' +
                  p[2] +
                  '"></i>' +
                  '<span>' +
                  esc(p[0] || 'Unnamed pillar') +
                  '</span><b>' +
                  p[1] +
                  '%</b></div>'
                )
              })
              .join('') +
            '</div>' +
            srcChip(r)
          )
        }
        if (r.kind === 'style') return styleGallery(v)
        if (r.kind === 'sched')
          return '<span class="val">' + esc(schedText(v)) + '</span>' + srcChip(r)
        if (r.kind === 'plat') {
          var live = connected[String(v).toLowerCase()]
          return (
            '<span class="val">' +
            esc(v || '—') +
            '</span>' +
            '<span class="pill ' +
            (live ? 'ok' : 'bad') +
            '">' +
            (live ? 'Connected' : 'Not connected') +
            '</span>'
          )
        }
        if (r.kind === 'sw') {
          return (
            '<span class="minisw" aria-hidden="true">' +
            (v || [])
              .map(function (c) {
                return '<i style="background:' + esc(c) + '"></i>'
              })
              .join('') +
            '</span>' +
            srcChip(r)
          )
        }
        return '<span class="val">' + (esc(v) || '—') + '</span>' + srcChip(r)
      }

      /* "Mondays 09:00 · 3 a week" — the sentence form of the cadence object. */
      function schedText(v) {
        if (!v || !v.day) return '—'
        return v.day + 's ' + v.time + ' · ' + v.n + ' a week'
      }

      function srcChip(r) {
        if (resolved[r.id]) return '<span class="src">your call</span>'
        if (!r.src) return ''
        return '<span class="src' + (r.conf === 'low' ? ' low' : '') + '">' + esc(r.src) + '</span>'
      }

      function updateHeader() {
        if (manualMode) return
        var asks = openAsks().length
        document.getElementById('dSub').innerHTML =
          'Read <b>' +
          esc(host) +
          '</b> · ' +
          ROWS.length +
          ' details drafted' +
          (asks ? ' · <b>' + asks + '</b> need your call' : ' · all checked')
      }

      function setBar(n) {
        var t = document.getElementById('barT'),
          tx = document.getElementById('barTx')
        var jump = document.getElementById('jump')
        jump.classList.add('hide')
        /* "Nothing detected" was true for one second and wrong from then on. A count
     that climbs as you type is the same honesty with something to show for it. */
        if (manualMode) {
          var filled = filledCount()
          t.className = filled ? 'bar-t ok' : 'bar-t'
          tx.innerHTML =
            '<b>' +
            filled +
            ' of ' +
            ROWS.length +
            ' filled</b> ' +
            '<span>· save whenever you like, the rest stays editable</span>'
          return
        }
        if (!reviewing) {
          t.className = 'bar-t'
          tx.innerHTML = '<b>Reading the site…</b>'
          return
        }
        if (n > 0) {
          t.className = 'bar-t'
          tx.innerHTML =
            '<b>' +
            n +
            ' thing' +
            (n > 1 ? 's' : '') +
            ' need' +
            (n > 1 ? '' : 's') +
            ' your call</b> ' +
            '<span>· everything else is drafted</span>'
          jump.classList.remove('hide')
        } else {
          t.className = 'bar-t ok'
          tx.innerHTML = '<b>All checked</b> <span>· ready to save</span>'
        }
      }

      document.getElementById('jump').onclick = function () {
        var next = doc.querySelector('.crow.ask-me')
        if (!next) return
        next.scrollIntoView({ behavior: 'smooth', block: 'center' })
        var b = next.querySelector('.qz-o button')
        if (b)
          setTimeout(function () {
            b.focus()
          }, 420)
      }

      /* Redraws one row in whichever view it is currently showing. The platform row
   has to redraw on a connection too: the chip's dot, the pill and the button all
   encode the same fact, so refreshing one of them would leave the other two lying. */
      function repaint(id, announce) {
        var row = doc.querySelector('.crow[data-id="' + id + '"]'),
          r = rowById(id)
        if (!row) return
        var editing = manualMode || row.classList.contains('open')
        row.querySelector('.cv').innerHTML = editing ? editorFor(r) : readValue(r)
        if (manualMode) setBar(0)
        if (announce) live.textContent = announce + '.'
      }

      /* ════ Editing — expands one row in place ════ */
      function openEditor(id) {
        var row = doc.querySelector('.crow[data-id="' + id + '"]')
        if (!row || row.classList.contains('open')) return
        var r = rowById(id)
        row.classList.add('open')
        row.querySelector('.cv').innerHTML = editorFor(r)
        row.querySelector('.cedit').textContent = 'Done'
        row.querySelector('.cedit').dataset.done = '1'
        var first = row.querySelector('textarea,input,button.tag')
        if (first && first.focus) first.focus()
      }

      function closeEditor(id) {
        var row = doc.querySelector('.crow[data-id="' + id + '"]')
        if (!row) return
        var r = rowById(id)
        row.classList.remove('open')
        row.querySelector('.cv').innerHTML = readValue(r)
        var b = row.querySelector('.cedit')
        b.textContent = 'Edit'
        delete b.dataset.done
      }

      function editorFor(r) {
        var v = A[r.id]
        /* A row whose answer is one of a known few stays a choice when it is edited.
     Falling through to a textarea here meant manual mode threw away the four
     goal options and asked you to invent the wording yourself. */
        if (r.opts && !r.kind) {
          return (
            '<div class="qz-o" role="radiogroup" aria-label="' +
            esc(r.l) +
            '">' +
            r.opts
              .map(function (o, i) {
                return (
                  '<button role="radio" aria-checked="' +
                  (v === o ? 'true' : 'false') +
                  '" ' +
                  'tabindex="' +
                  (v === o || (!v && !i) ? '0' : '-1') +
                  '" data-opt="' +
                  esc(o) +
                  '">' +
                  esc(o) +
                  '</button>'
                )
              })
              .join('') +
            '</div>'
          )
        }
        if (r.kind === 'tags') {
          /* The chips are the audiences that were *detected*. With no site read there
       is no such list, and offering the last client's — "Valuation clients" to a
       wine bar — would be inventing content on the one screen whose whole promise
       is that it invents nothing. Manual mode asks the question instead. */
          if (manualMode)
            return (
              '<textarea class="f-in" rows="1" data-txt="' +
              esc(r.id) +
              '" ' +
              'placeholder="Who are they trying to reach?" aria-label="' +
              esc(r.l) +
              '">' +
              esc(Array.isArray(v) ? v.join(', ') : v || '') +
              '</textarea>'
            )
          return (
            '<div class="tags">' +
            (r.v || [])
              .map(function (t) {
                return (
                  '<button class="tag" aria-pressed="' +
                  ((v || []).indexOf(t) > -1 ? 'true' : 'false') +
                  '" ' +
                  'data-tag="' +
                  esc(t) +
                  '" data-row="' +
                  esc(r.id) +
                  '">' +
                  esc(t) +
                  '</button>'
                )
              })
              .join('') +
            '</div>'
          )
        }
        if (r.kind === 'mix') {
          return (v || [])
            .map(function (p, n) {
              return (
                '<div class="arow"><span class="sw" style="background:' +
                p[2] +
                '" aria-hidden="true"></span>' +
                '<input class="nm" value="' +
                esc(p[0]) +
                '" data-mix="' +
                n +
                '" data-k="0" ' +
                'placeholder="Pillar name" aria-label="Pillar name">' +
                '<span class="pc"><input type="number" min="0" max="100" value="' +
                p[1] +
                '" data-mix="' +
                n +
                '" ' +
                'data-k="1" aria-label="' +
                esc(p[0]) +
                ' percent"><span aria-hidden="true">%</span></span></div>'
              )
            })
            .join('')
        }
        if (r.kind === 'sw') {
          return (
            '<div class="swr">' +
            (v || [])
              .map(function (c, n) {
                return (
                  '<input type="color" value="' +
                  esc(c) +
                  '" data-sw="' +
                  n +
                  '" aria-label="Brand colour ' +
                  (n + 1) +
                  '">'
                )
              })
              .join('') +
            '</div>'
          )
        }
        if (r.kind === 'style') return styleGallery(v)
        if (r.kind === 'sched') return schedPicker(v)
        if (r.kind === 'plat') return platPicker(v)
        return (
          '<textarea class="f-in" rows="' +
          (r.big ? 3 : 1) +
          '" data-txt="' +
          esc(r.id) +
          '" ' +
          (r.ph ? 'placeholder="' + esc(r.ph) + '" ' : '') +
          'aria-label="' +
          esc(r.l) +
          '">' +
          esc(v) +
          '</textarea>'
        )
      }

      /* Two option rows. A div[role=button] rather than a <button>, because the zoom
   control lives inside the row and a button cannot nest one — the same shape
   style-card.tsx uses, and the reason keydown below handles Enter and Space. */
      function styleGallery(current) {
        return (
          '<div class="sysopts" role="group" aria-label="Visual system">' +
          STYLES.map(function (st) {
            var on = st.id === current
            return (
              '<div class="sysopt" role="button" tabindex="0" ' +
              'aria-pressed="' +
              (on ? 'true' : 'false') +
              '" data-style="' +
              esc(st.id) +
              '">' +
              '<img class="sthumb" src="' +
              esc(st.src) +
              '" alt="">' +
              '<span><span class="sname">' +
              esc(st.name) +
              '</span>' +
              '<span class="sdesc">' +
              esc(st.desc) +
              '</span>' +
              '<span class="sfonts">' +
              esc(st.fonts) +
              '</span></span>' +
              '<span class="sact">' +
              '<button class="szoom" data-zoom="' +
              esc(st.id) +
              '" title="See it full size" ' +
              'aria-label="See ' +
              esc(st.name) +
              ' full size">' +
              '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
              'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
              '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8.5v5M8.5 11h5"/>' +
              '</svg></button>' +
              '<span class="schk" aria-hidden="true">' +
              '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
              'stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' +
              '<path d="M4 12.5l5.5 5.5L20 6.5"/></svg></span>' +
              '</span></div>'
            )
          }).join('') +
          '</div>' +
          /* From brand-styles.ts, whose prompts are deliberately colour-free: "the
       client's palette is the only colour source". One line, because the palette
       row it refers to is two rows below. */
          '<p class="sysnote">Every visual is generated in this system — it sets the ' +
          'typography, grid and texture, and the brand palette supplies the colour.</p>'
        )
      }

      /* A cadence, not a date: posting repeats, so the thing to pick is a weekday, a
   time and a count — the three fields settings/schedule-tab.tsx uses, with its
   WeekPreview underneath so the choice is visible as a week. */
      function schedPicker(v) {
        var sel = function (name, opts, cur, label) {
          return (
            '<div><label class="flab" for="s-' +
            name +
            '">' +
            label +
            '</label>' +
            '<select class="f-sel" id="s-' +
            name +
            '" data-sched="' +
            name +
            '">' +
            opts
              .map(function (o) {
                return '<option' + (o === cur ? ' selected' : '') + '>' + esc(o) + '</option>'
              })
              .join('') +
            '</select></div>'
          )
        }
        return (
          '<div class="fgrid">' +
          sel('n', PER_RUN, v.n, 'How many') +
          sel('day', WEEKDAYS, v.day, 'Generate on') +
          '<div><label class="flab" for="s-time">Time</label>' +
          '<input class="f-time" id="s-time" type="time" value="' +
          esc(v.time) +
          '" data-sched="time"></div>' +
          '</div>' +
          weekPreview(v)
        )
      }

      /* Seven cells, the run day filled. Purely visual, so it is aria-hidden and the
   same fact is spelled out beside it — the rule DESIGN.md sets for the coverage
   strip, and what the shipped WeekPreview already does. */
      function weekPreview(v) {
        return (
          '<div class="week" aria-hidden="true">' +
          WEEKDAYS.map(function (d) {
            var on = d === v.day
            return (
              '<i class="' +
              (on ? 'on' : '') +
              '">' +
              d.slice(0, 3) +
              '<b>' +
              (on ? esc(v.n) : '—') +
              '</b></i>'
            )
          }).join('') +
          '</div><p class="sr">' +
          esc(v.n) +
          ' posts generated every ' +
          esc(v.day) +
          ' at ' +
          esc(v.time) +
          '.</p>'
        )
      }

      /* Two questions in one row, because they are one decision: where posts go, and
   whether that is actually possible yet. The chips are the platform choice; the
   rows below are the OAuth connections, and a platform can be picked before it
   is connected — Kontuur still drafts and schedules, it just cannot publish. */
      function platPicker(current) {
        return (
          '<div class="chips" role="group" aria-label="Publishing platform">' +
          PLATFORMS.map(function (name) {
            var ok = !!LIVE_PLATFORMS[name]
            var live = connected[name.toLowerCase()]
            return (
              '<button class="chip" aria-pressed="' +
              (ok && name === current ? 'true' : 'false') +
              '"' +
              (ok ? '' : ' disabled') +
              ' data-plat="' +
              esc(name) +
              '">' +
              (ok
                ? '<span class="dot' + (live ? ' live' : '') + '" aria-hidden="true"></span>'
                : '') +
              esc(ok ? name : name + ' · soon') +
              '</button>'
            )
          }).join('') +
          '</div><div class="accts">' +
          ACCOUNTS.map(function (a) {
            var live = connected[a.id]
            var pill = !a.supported
              ? '<span class="pill warn">Coming soon</span>'
              : live
                ? '<span class="pill ok">Connected</span>'
                : '<span class="pill bad">Not connected</span>'
            var action = !a.supported
              ? ''
              : live
                ? '<button class="btn btn-ghost btn-sm" data-disconnect="' +
                  a.id +
                  '">Disconnect</button>'
                : '<button class="btn btn-sec btn-sm" data-connect="' + a.id + '">Connect</button>'
            return (
              '<div class="acct' +
              (a.supported ? '' : ' soon') +
              '">' +
              '<span class="stile" aria-hidden="true">' +
              a.initials +
              '</span>' +
              /* The shipped row shows connection.account_name here. A mock cannot know
             it, and inventing a handle would be fabricated proof — so the line
             states the consequence of connecting instead, which is true either
             way and stops the note reading "required" once it no longer is. */
              '<span class="tx"><b>' +
              esc(a.label) +
              '</b><span>' +
              esc(live ? 'Publishing enabled' : a.note) +
              '</span></span>' +
              pill +
              action +
              '</div>'
            )
          }).join('') +
          '</div>'
        )
      }

      /* ════ Exceptions — answered in place, in the row they belong to ════ */
      function chooseOpt(btn) {
        var card = btn.closest('.crow'),
          id = card.dataset.id,
          choice = btn.dataset.opt
        card.querySelectorAll('.qz-o button').forEach(function (x) {
          x.setAttribute('aria-checked', x === btn ? 'true' : 'false')
          x.tabIndex = x === btn ? 0 : -1
        })

        /* In manual mode the row is already open and stays open — picking an option is
     just setting a value, with no exception to resolve and no read view to
     collapse back into. */
        if (manualMode) {
          A[id] = choice
          setBar(0)
          live.textContent = rowById(id).l + ' set to ' + choice + '.'
          return
        }

        /* Neither of these resolves the row on its own, so the count must not drop. */
        if (id === 'pal' && choice === 'Pick manually') return palManual(card)
        if (id === 'pal' && choice === 'Re-scan') return palRescan(card)

        if (id !== 'pal') A[id] = choice
        resolved[id] = 1
        var r = rowById(id)
        r.ask = 0
        card.classList.remove('ask-me')
        card.classList.add('resolved')
        card.querySelector('.cv').innerHTML = readValue(r)
        updateHeader()
        setBar(openAsks().length)
        live.textContent = r.l + ' set to ' + choice + '.'
      }

      function palManual(card) {
        card.querySelector('.swr').innerHTML = A.pal
          .map(function (c, n) {
            return (
              '<input type="color" value="' +
              esc(c) +
              '" data-sw="' +
              n +
              '" aria-label="Brand colour ' +
              (n + 1) +
              '">'
            )
          })
          .join('')
        card.querySelector('.qq').textContent = 'Set the five brand colours yourself, then confirm.'
        /* Secondary, not primary: the save bar already owns this view's one primary. */
        card.querySelector('.qz-o').innerHTML =
          '<button class="btn btn-sec btn-sm" data-opt="Set by hand">Use these colours</button>'
        live.textContent = 'Pick the five brand colours by hand.'
      }

      function palRescan(card) {
        var p = card.querySelector('.qq'),
          g = card.querySelector('.qz-o')
        p.textContent = 'Reading the page again…'
        g.style.opacity = '.4'
        setTimeout(function () {
          g.style.opacity = ''
          /* Honest: re-reading the same page returns the same palette. It does not
       invent a friendlier one — it tells you the purple is genuinely there. */
          p.textContent =
            'Read again — same result. The purple really is on the page, so it is ' +
            'either their brand or a banner that covers every view.'
          g.querySelectorAll('button').forEach(function (b) {
            b.setAttribute('aria-checked', 'false')
          })
          live.textContent = 'Re-read finished. Same palette.'
        }, 1400)
      }

      /* ════ Events ════ */
      document.addEventListener('click', function (e) {
        var t = e.target

        var opt = t.closest('.qz-o button, .crow .btn-sec')
        if (opt && opt.dataset.opt) return chooseOpt(opt)

        var ed = t.closest('.cedit')
        if (ed) return ed.dataset.done ? closeEditor(ed.dataset.edit) : openEditor(ed.dataset.edit)

        var zm = t.closest('[data-zoom]')
        if (zm) return openLightbox(zm.dataset.zoom)
        if (t.closest('#lbx') || t.id === 'lb') return closeLightbox()

        var sc = t.closest('.sysopt')
        if (sc) {
          A.style = sc.dataset.style
          return repaint('style', styleById(A.style).name)
        }

        var pc = t.closest('.chip')
        if (pc && !pc.disabled) {
          A.plat = pc.dataset.plat
          return repaint('plat', A.plat)
        }

        /* The mock stands in for the OAuth round trip; the state it lands in is the
     one the real connection produces. */
        var cn = t.closest('[data-connect]'),
          dc = t.closest('[data-disconnect]')
        if (cn || dc) {
          connected[(cn || dc).dataset[cn ? 'connect' : 'disconnect']] = !!cn
          return repaint('plat', 'Instagram ' + (cn ? 'connected' : 'disconnected'))
        }

        var tg = t.closest('button.tag')
        if (tg) {
          var listRow = tg.dataset.row,
            cur = A[listRow] || [],
            val = tg.dataset.tag
          var k = cur.indexOf(val)
          if (k > -1) cur.splice(k, 1)
          else cur.push(val)
          A[listRow] = cur
          tg.setAttribute('aria-pressed', k > -1 ? 'false' : 'true')
          if (manualMode) setBar(0)
          return
        }

        if (t.closest('#rescan')) return rescan()
        if (t.closest('#save')) return done()
        if (t.closest('#discard') || t.closest('#exit') || t.closest('#again'))
          return location.reload()
      })

      document.addEventListener('input', function (e) {
        var t = e.target,
          d = t.dataset
        if (d.txt) {
          if (t.tagName === 'TEXTAREA') {
            t.style.height = 'auto'
            t.style.height = t.scrollHeight + 'px'
          }
          A[d.txt] = t.value
          if (d.txt === 'name' && manualMode) manualName(t.value)
        } else if (d.mix !== undefined) {
          var row = t.closest('.crow'),
            id = row ? row.dataset.id : 'mix'
          var p = A[id][+d.mix]
          p[d.k === '1' ? 1 : 0] = d.k === '1' ? Math.max(0, Math.min(100, +t.value || 0)) : t.value
        } else if (d.sched) {
          A.sched[d.sched] = t.value
          /* The week strip is part of the editor, so it is redrawn with it — otherwise
       the run day keeps pointing at the previous answer. */
          var srow = t.closest('.crow')
          if (srow) srow.querySelector('.cv').innerHTML = editorFor(rowById('sched'))
        } else if (d.sw !== undefined) {
          var owner = t.closest('.crow')
          if (owner) A[owner.dataset.id][+d.sw] = t.value
        } else return
        if (manualMode) setBar(0)
      })

      document.addEventListener('keydown', function (e) {
        var el = document.activeElement
        if (
          el &&
          el.closest &&
          el.closest('.qz-o') &&
          (e.key === 'ArrowRight' || e.key === 'ArrowLeft')
        ) {
          var list = Array.prototype.slice.call(el.closest('.qz-o').querySelectorAll('button'))
          var i = list.indexOf(el)
          e.preventDefault()
          list[(i + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length].focus()
          return
        }
        if (
          el &&
          el.classList &&
          el.classList.contains('sysopt') &&
          (e.key === 'Enter' || e.key === ' ')
        ) {
          e.preventDefault()
          A.style = el.dataset.style
          return repaint('style', styleById(A.style).name)
        }
        if (e.key === 'Escape' && !document.getElementById('lb').hidden) return closeLightbox()
        if (e.key === 'Escape' && el && el.closest) {
          var open = el.closest('.crow.open')
          if (open) closeEditor(open.dataset.id)
        }
      })

      function rescan() {
        live.textContent = 'Reading ' + host + ' again.'
        document.getElementById('dAct').innerHTML = '<span class="src">Reading again…</span>'
        setTimeout(function () {
          document.getElementById('dAct').innerHTML =
            '<button class="btn btn-sec btn-sm" id="rescan">Read it again</button>'
          live.textContent = 'Re-read finished. Nothing changed.'
        }, 1600)
      }

      /* The previews are 768×1024 posters shown at 56px in the row; the zoom is how
   the system stays inspectable at that size. Focus moves to Close and returns to
   the row that opened it, because a dialog that strands focus behind itself is
   worse than no dialog. */
      var zoomOrigin = null
      function openLightbox(id) {
        var st = styleById(id),
          lb = document.getElementById('lb')
        zoomOrigin = doc.querySelector('.sysopt[data-style="' + id + '"]')
        document.getElementById('lbfig').innerHTML =
          '<img src="' +
          esc(st.src) +
          '" alt="' +
          esc(st.name) +
          ' preview">' +
          '<figcaption>' +
          esc(st.name) +
          ' · ' +
          esc(st.fonts) +
          '</figcaption>'
        lb.hidden = false
        document.getElementById('lbx').focus()
      }

      function closeLightbox() {
        document.getElementById('lb').hidden = true
        document.getElementById('lbfig').innerHTML = ''
        if (zoomOrigin) zoomOrigin.focus()
        zoomOrigin = null
      }

      /* ════ 3 · Done ════ */
      function done() {
        var name = A.name || 'New client'
        document.getElementById('s2').classList.add('hide')
        document.getElementById('bar').classList.remove('on')
        page.classList.remove('wide')
        var s3 = document.getElementById('s3')
        s3.classList.remove('hide')
        s3.innerHTML =
          '<div class="done">' +
          '<div class="ring"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" ' +
          'stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M4 12.5l5.5 5.5L20 6.5"/></svg></div>' +
          '<h1 class="' +
          (hasCyrillic(name) ? 'cyr' : '') +
          '"><em>' +
          esc(name) +
          '</em> is ready</h1>' +
          "<p>Profile saved. Everything stays editable in the client's settings.</p>" +
          '<div class="nxs">' +
          nx(
            1,
            'Generate the first 3 posts',
            'Drafts land in your review queue',
            '<path d="M7 1.5l1.2 3.3 3.3 1.2-3.3 1.2L7 10.5 5.8 7.2 2.5 6l3.3-1.2z"/>'
          ) +
          nx(
            0,
            'Connect Instagram',
            'Required before anything can publish',
            '<path d="M5.5 8.5l3-3M6 3.5l1-1a2.5 2.5 0 013.5 3.5l-1 1M8 10.5l-1 1a2.5 2.5 0 01-3.5-3.5l1-1"/>'
          ) +
          nx(
            0,
            'Add another client',
            'Read another site',
            '<path d="M2 7a5 5 0 118 4"/><path d="M2 4v3h3"/>',
            'again'
          ) +
          '</div></div>'
        live.textContent = name + ' is ready.'
      }

      function nx(pri, title, sub, path, id) {
        return (
          '<button class="nx' +
          (pri ? ' pri' : '') +
          '"' +
          (id ? ' id="' + id + '"' : '') +
          '>' +
          '<span class="nx-ic"><svg width="16" height="16" viewBox="0 0 14 14" fill="none" ' +
          'stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">' +
          path +
          '</svg></span>' +
          '<span class="tx"><b>' +
          title +
          '</b><span>' +
          sub +
          '</span></span>' +
          '<svg class="go" width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" ' +
          'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5L9.5 7 5 11.5"/>' +
          '</svg></button>'
        )
      }

      url.focus()
    </script>
  </body>
</html>
