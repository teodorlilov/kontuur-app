name: check

# Runs on every push and PR, not just main. The pre-push hook covers the same
# ground locally, but it is skippable (`--no-verify`) and only exists on machines
# where `npm install` has run — so this is the copy that is actually authoritative.
on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 LTS: Next 16 requires >=20, and this stays close to what Vercel
          # builds with. Bump both together if the deploy runtime moves.
          node-version: 22
          cache: npm

      # Node 22 ships npm 10, but the lockfile is written by npm 11 on dev machines,
      # and the two disagree about optional wasm binaries. `@oxc-resolver/binding-wasm32-wasi`
      # pins `@emnapi/core`/`@emnapi/runtime` at exactly 1.11.2 while the root hoists 1.11.3;
      # npm 11 treats that as satisfied and writes no nested entry, npm 10 demands one and
      # fails `ci` with "Missing: @emnapi/core@1.11.2 from lock file". Neither lockfile is
      # wrong — they just have to be read by the version that wrote them. Pin npm here rather
      # than bumping Node, so the build stays on the runtime Vercel deploys with.
      - run: npm install -g npm@11

      # ci, not install: builds from the lockfile exactly, so a run cannot pass on
      # a dependency tree that no one has committed.
      - run: npm ci

      # typecheck && lint && test. Deliberately NOT `npm test` — vitest is
      # transpile-only, so tests alone prove nothing about types.
      - run: npm run check

      # `tsc --noEmit` does not evaluate the App Router's own rules: a server-only
      # module pulled into a client bundle, a bad `metadata` shape, an invalid route
      # segment config. On an app that routes 50+ files through a service-role Supabase
      # client, "server code reached the browser" is precisely the class of mistake worth
      # a build to catch — and `npm run check` passing was never evidence the app builds.
      # Env vars are placeholders: the build only needs them present, not valid.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: https://placeholder.test
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
